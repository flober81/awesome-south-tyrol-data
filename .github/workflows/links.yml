# Checks every link in README.md once a month and opens an issue when one is broken.
name: Link check

on:
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # LexBrowser answers 500 to GitHub runners but 200 from Italy (checked 16.11.2026), so it is skipped here.
          args: --no-progress --max-retries 3 --timeout 30 --accept 200,429 --exclude lexbrowser.provinz.bz.it README.md
          fail: false

      - name: Open issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Broken links found by the monthly check
          content-filepath: ./lychee/out.md
          labels: broken-link
