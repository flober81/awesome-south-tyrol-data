# Checks README.md against the rules of awesome lists (awesome-lint) on every change.
name: Awesome lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: awesome-lint
        run: npx --yes awesome-lint@2.3.0
